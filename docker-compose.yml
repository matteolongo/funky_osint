version: '3.8'

services:
  kali:
    image: kalilinux/kali-rolling:latest
    container_name: osint_me_kali
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"
    volumes:
      - ./tools:/tools
      - ./workspace:/workspace
      - ./scripts:/scripts:ro
      - ./repos.yml:/repos.yml:ro
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/scripts/install-tools.sh"]
    command: ["bash", "-l"]
