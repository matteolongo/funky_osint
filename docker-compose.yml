services:
  kali:
    image: osint_me:local
    build:
      context: .
    container_name: osint_me_kali
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: ["bash", "-l"]
  dashboard:
    image: osint_me:local
    depends_on:
      - kali
    command: ["python3", "/dashboard/server.py"]
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./workspace:/workspace:ro
    read_only: true
    cap_drop:
      - ALL
