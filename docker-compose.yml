services:
  kali:
    image: osint_me:local
    build:
      context: .
    container_name: osint_me_kali
    tty: true
    stdin_open: true
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_REVIEW_TIMEOUT: ${OPENAI_REVIEW_TIMEOUT:-90}
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: ["bash", "-l"]
  dashboard:
    image: osint_me:local
    command: ["python3", "/dashboard/server.py"]
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./workspace:/workspace:ro
    read_only: true
    cap_drop:
      - ALL
