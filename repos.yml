# repos.yml
# Pinned tools installed at image build time; adapters control runtime behavior.
tools:
  - name: phoneinfoga
    repo: https://github.com/sundowndev/phoneinfoga.git
    ref: 55807b05b753dab7bc6fe67403ca385668dda179
    dest: /tools/phoneinfoga
    enabled: true
    build:
      apt_deps:
        - git
        - ca-certificates
        - golang-go
        - nodejs
        - build-essential
      pre_cmds: []
      cmds:
        - go mod download
        - cd web/client && node .yarn/releases/yarn-3.2.4.cjs install --immutable && NODE_OPTIONS=--openssl-legacy-provider node .yarn/releases/yarn-3.2.4.cjs build && cd ../..
        - go build -ldflags="-s -w" -o /usr/local/bin/phoneinfoga .
    check_bin: phoneinfoga

  - name: sherlock
    repo: https://github.com/sherlock-project/sherlock.git
    ref: e40a45ec2a074b90703b3b4b842c8a3adbd6ada3
    python_env: true
    dest: /tools/sherlock
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
        - python3-venv
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: sherlock

  - name: maigret
    repo: https://github.com/soxoj/maigret.git
    ref: 467ce79812756d6c4d5864a223479e6cb89a775f
    python_env: true
    dest: /tools/maigret
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
        - python3-venv
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: maigret

  - name: holehe
    repo: https://github.com/megadose/holehe.git
    ref: 14da70f588538936b20d238783c5e28a0772a2b3
    python_env: true
    dest: /tools/holehe
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
        - python3-venv
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: holehe

  - name: ignorant
    repo: https://github.com/megadose/ignorant.git
    ref: 40b3eb734ef3d55e6d16eb314e49dbf520fa1f64
    python_env: true
    dest: /tools/ignorant
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
        - python3-venv
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: ignorant
