# repos.yml
# Tools to auto-install inside the Kali container on first start
tools:
  - name: phoneinfoga
    repo: https://github.com/sundowndev/phoneinfoga.git
    ref: master
    dest: /tools/phoneinfoga
    enabled: true
    build:
      apt_deps:
        - git
        - ca-certificates
        - golang-go
        - nodejs
        - build-essential
      pre_cmds: []
      cmds:
        - go mod download
        - cd web/client && node .yarn/releases/yarn-3.2.4.cjs install --immutable && NODE_OPTIONS=--openssl-legacy-provider node .yarn/releases/yarn-3.2.4.cjs build && cd ../..
        - go build -ldflags="-s -w" -o /usr/local/bin/phoneinfoga .
    check_bin: phoneinfoga

  - name: sherlock
    repo: https://github.com/sherlock-project/sherlock.git
    ref: master
    dest: /tools/sherlock
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: sherlock

  - name: maigret
    repo: https://github.com/soxoj/maigret.git
    ref: main
    dest: /tools/maigret
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: maigret

  - name: holehe
    repo: https://github.com/megadose/holehe.git
    ref: master
    dest: /tools/holehe
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: holehe

  - name: ignorant
    repo: https://github.com/megadose/ignorant.git
    ref: master
    dest: /tools/ignorant
    enabled: true
    build:
      apt_deps:
        - git
        - python3
        - python3-pip
      pre_cmds: []
      cmds:
        - pip3 install --no-cache-dir .
    check_bin: ignorant
